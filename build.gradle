plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.MiguelRocha-24.hero'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    implementation 'com.googlecode.lanterna:lanterna:3.1.1'
}

application {
    mainClass = 'feup2526.ldts.t02g03.application.App'
}

run {
    standardInput = System.in
}
test {
    useJUnitPlatform()
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    junit5PluginVersion = '1.2.1'
    // Selective mutation testing - only controllers
    // Excluding Game class due to threading and System.exit() issues
    targetClasses = [
        'feup2526.ldts.t02g03.controller.*',
        'feup2526.ldts.t02g03.model.*'
    ]
    excludedClasses = [
        'feup2526.ldts.t02g03.application.Game'
    ]
    targetTests = [
        'feup2526.ldts.t02g03.controller.*',
        'feup2526.ldts.t02g03.model.*'
    ]
    mutators = ['DEFAULTS']
    outputFormats = ['HTML', 'XML']
    timestampedReports = true
    threads = 4
    excludedMethods = ['main']
    verbose = false
}